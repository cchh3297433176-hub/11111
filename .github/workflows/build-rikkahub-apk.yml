name: Build RikkaHub APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'rikkahub-no-think-tag.part.*'
      - '.github/workflows/build-rikkahub-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reassemble source ZIP
        shell: bash
        run: |
          set -e
          ls -lh rikkahub-no-think-tag.part.*
          cat rikkahub-no-think-tag.part.{001..010} > rikkahub-no-think-tag.zip
          unzip -q rikkahub-no-think-tag.zip
          mv rikkahub-master source
          echo "Source restored to: $PWD/source"

      - name: Check Firebase config
        shell: bash
        run: |
          if [ ! -f source/app/google-services.json ]; then
            echo "ERROR: source/app/google-services.json is missing."
            echo "RikkaHub's own README requires this file for building."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: source
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RikkaHub-no-think-tag-debug-apk
          path: source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
